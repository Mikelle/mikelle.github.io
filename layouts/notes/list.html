{{ define "main" }}
<h1 class="sr-only">Notes</h1>
<div class="cmd-line">
    <span class="prompt" aria-hidden="true">~$</span> <span class="command">cat</span> <span class="string">notes.log</span>
</div>

{{ range .Pages }}
<div class="log-entry">
    <div class="log-date">// {{ .Date.Format "2006.01.02" }}</div>
    <div class="log-title"><a href="{{ .Permalink }}">{{ .Title }}</a></div>
    <div class="log-content">
        {{ .Summary }}
    </div>
    {{ with .Params.tags }}
    <div class="log-tags">
        {{ range . }}<span class="log-tag">{{ . }}</span>{{ end }}
    </div>
    {{ end }}
</div>
{{ else }}
<p class="empty-msg">No notes yet.</p>
{{ end }}
{{ end }}
