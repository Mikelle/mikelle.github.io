{{ define "main" }}
<section class="section error-screen">
    <div class="cmd-line">
        <span class="prompt" aria-hidden="true">~$</span> <span class="command">cd</span> <span class="string">/unknown</span>
    </div>
    <div class="output more-link">
        <div class="error-line">
            bash: cd: No such file or directory
        </div>
        <div class="error-code">
            Error 404: page not found
        </div>
        <div class="cmd-line">
            <span class="prompt" aria-hidden="true">~$</span> <span class="command">ls</span> <span class="string">available/</span>
        </div>
        <div class="error-links">
            <a href="/">~/home</a>
            <a href="/blog/">~/blog</a>
            <a href="/notes/">~/notes</a>
        </div>
    </div>
    <div class="cmd-line error-back">
        <span class="prompt" aria-hidden="true">~$</span> <a href="/">cd ~</a>
    </div>
</section>
{{ end }}
